name: Deploy Artigos

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Publii site
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main website
        uses: actions/checkout@v4
        with:
          repository: fidellp99/fidellp99.github.io
          path: main-site
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Copy Publii site
        run: |
          rm -rf main-site/artigos
          mkdir -p main-site/artigos

          cp -R source/. main-site/artigos/

          rm -rf main-site/artigos/.git
          rm -rf main-site/artigos/.github

      - name: Commit and push
        working-directory: main-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artigos/

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy artigos"
            git push
          fi
